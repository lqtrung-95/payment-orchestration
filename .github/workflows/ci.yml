name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run on the same branch has nothing useful left to say.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches deploy/docker-compose.yml so local and CI behave identically.
  POSTGRES_DSN: postgres://payment:payment@localhost:5432/payment?sslmode=disable

jobs:
  build:
    name: Build, vet, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: payment
          POSTGRES_PASSWORD: payment
          POSTGRES_DB: payment
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payment -d payment"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Single source of truth for the toolchain version.
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Migrations must exist before the integration tests run.
      - name: Apply migrations
        run: go run ./cmd/migrate up

      # -p 1 runs one package at a time: integration tests share a database and
      # truncate between cases, so concurrent packages would wipe each other.
      - name: Test
        run: go test -race -count=1 -p 1 -coverprofile=coverage.out ./...

      # Migrations are exercised in both directions. An up-only check passes
      # happily with an unusable down migration, which is exactly what you need
      # when a deploy has to be rolled back.
      - name: Revert and re-apply migrations
        run: |
          go run ./cmd/migrate down
          go run ./cmd/migrate up

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # v7 or later is required: earlier action releases reject a golangci-lint
      # v2 version string outright, since v2 changed the config schema.
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
